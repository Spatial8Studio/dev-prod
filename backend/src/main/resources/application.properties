server.port=${SERVER_PORT:8085}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
spatia.storage-root=${SPATIA_STORAGE_ROOT:storage}
spatia.matlab-command=${SPATIA_MATLAB_COMMAND:matlab}
spatia.matlab-directory=${SPATIA_MATLAB_DIRECTORY:matlab}
spatia.matlab-timeout-seconds=${SPATIA_MATLAB_TIMEOUT_SECONDS:900}
spatia.hrir-file=${SPATIA_HRIR_FILE:}
spring.jackson.serialization.write-dates-as-timestamps=false
logging.level.com.spatia.studio=INFO
